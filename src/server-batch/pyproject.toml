[project]
name = "artemis-ingest"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    # ── Core ───────────────────────────────────────────────────────────────
    "beautifulsoup4",
    "certifi",
    "google-api-python-client",
    "lxml",
    "matplotlib",
    "numpy",
    "opencv-python",   # MergeMertens exposure fusion for HDR composites (step 4d2)
    "Pillow",
    "pydub",
    "pyexiftool",      # ExifTool subprocess wrapper — reads NEF/DNG makernotes (step 4a)
    "python-dateutil",
    "rawpy",           # libraw bindings — decode NEF + DNG for tier generation (step 4d)
    "python-dotenv",
    "requests",
    "rich",
    "setuptools<81",
    "tqdm",
    "yt-dlp",
    # ── Transcription (WhisperX / pyannote) ───────────────────────────────
    # PyTorch >=2.6 for CVE-2025-32434 fix; <2.9 because torchaudio 2.9+ removed
    # AudioMetaData which pyannote-audio 3.x (used by whisperx) still requires.
    "torch>=2.6.0,<2.9",
    "torchaudio>=2.6.0,<2.9",
    "ctranslate2==4.4.0",
    "faster-whisper==1.1.1",
    "lightning==2.5.1.post0",
    "pyannote-audio==3.3.2",
    "pytorch-lightning==2.5.1.post0",
    "speechbrain==1.0.3",
    "webrtcvad-wheels",
    "whisperx==3.3.4",
]

[tool.uv]
# Required for CUDA-enabled PyTorch wheels
extra-index-url = ["https://download.pytorch.org/whl/cu126"]
# Do not install this project as a package — only sync dependencies
package = false
# onnxruntime 1.21+ dropped cp310 wheels; constrain transitive dependency
constraint-dependencies = ["onnxruntime<=1.20.1"]
